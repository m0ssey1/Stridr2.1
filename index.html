<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#141a30;--ln:#27304f;--tx:#f1f4fa;--mu:#a7b0c8;--ac:#ff7a1a;--on:#1a0b00;--bad:#ff4d6d;--c1:#161d38;--c2:#0f1428;--deep:#070a16;--cell:#1b2342;--cell2:#121833;--hue:-50deg;--nav:rgba(11,16,32,.92);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.big{margin:0 0 .4em;line-height:1.1}h1{font-size:1.8rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
.big{font-size:2rem;color:var(--ac);font-weight:700}main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid .card{margin:0}
.mu{color:var(--mu);font-size:.9rem}label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mu)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;margin-top:4px}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:11px 16px;font:600 1rem Barlow,sans-serif;cursor:pointer;margin:0 6px 6px 0}button.g{background:none;color:var(--tx);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1 0 auto;background:none;color:var(--mu);margin:0;padding:10px 12px}nav button.on{color:var(--ac);border-bottom:2px solid var(--ac);border-radius:0}
.warn{border-color:var(--bad);color:var(--bad)}.bar{height:6px;background:var(--ln);border-radius:3px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}.wk div{border:1px solid var(--ln);border-radius:6px;padding:4px;font-size:.72rem;min-height:52px;cursor:pointer;overflow:hidden}
.wk .q{border-color:var(--ac)}.wk .t{background:var(--ac);color:var(--on)}.wk .s{outline:2px solid var(--tx)}.wk .d{opacity:.55}
svg text{fill:var(--mu);font-size:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}details{border-bottom:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:500}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln);font-size:.9rem}
h1,h2,h3,.big,button{font-family:Saira,"Arial Black",system-ui,sans-serif;font-style:italic;font-stretch:125%}h1,h2,h3,.big{font-weight:800}button{font-weight:700;font-stretch:115%;letter-spacing:.02em}nav button{font-size:.8rem}.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px}.brand img{width:44px;height:44px;border-radius:6px}.wm{font:italic 800 1.6rem/1 Saira,sans-serif;font-stretch:125%;color:var(--tx);display:block}.hero{display:block;width:min(260px,70%);margin:0 auto 8px}
body{font-size:17px;padding-bottom:116px}

.card{border-radius:22px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 1px 0 #ffffff10 inset}
input,select,textarea{border-radius:14px;padding:14px;font-size:1rem}
button{border-radius:999px;padding:14px 22px;min-height:48px}
nav{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--ln);border-radius:999px;background:var(--nav);backdrop-filter:blur(14px);justify-content:space-around;max-width:560px;margin:auto;overflow:visible}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;border-radius:22px;padding:6px 4px;min-height:0;flex:1}
nav button.on{background:var(--ac);color:var(--on);border-bottom:0;border-radius:22px}
.hi{font:italic 800 2.6rem/1 Saira,sans-serif;font-stretch:125%;margin:2px 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--deep);border:1px solid var(--ln);border-radius:14px;padding:8px 12px;font-size:.85rem;margin:0 6px 6px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac)}.dot.o{background:var(--bad)}
.cta{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:1.1rem;padding:12px 12px 12px 24px;margin:10px 0 6px}.cta em{font-style:normal;background:var(--deep);color:var(--ac);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.num{font:italic 800 4.2rem/1 Saira,sans-serif;font-stretch:125%;color:var(--ac)}.num small{font-size:1.4rem;color:var(--mu)}
.tile{border-radius:22px;padding:16px;min-height:110px}.tile small{font-weight:700;letter-spacing:.08em;font-size:.7rem}.tile .num{font-size:1.7rem;margin-top:8px;color:inherit}
.t1{background:var(--ac);color:var(--on)}.t2{background:#fff;color:#0a0a0a}.t3{background:var(--deep);border:1px solid var(--ln)}
.pr{position:relative;overflow:hidden;background:var(--deep);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:0 0 8px;display:flex;justify-content:space-between}.pr i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--ac) 28%,transparent)}.pr span,.pr b{position:relative}.pr b{font:italic 800 1.3rem/1 Saira,sans-serif}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;margin:12px 0 6px}.hm i{aspect-ratio:1;border-radius:4px;background:var(--cell)}.hm i.d{background:var(--ac)}.hm i.m{background:var(--bad)}.hm i.r{background:var(--cell2)}.hm i.t{outline:2px solid #fff}
.seg{display:flex;gap:6px}.seg i{flex:1;height:44px;border-radius:12px;background:var(--cell);display:grid;place-items:center;font:700 .8rem Barlow,sans-serif;font-style:normal;color:var(--mu)}.seg i.d{background:var(--ac);color:var(--on)}.seg i.m{background:var(--bad);color:#000}.seg i.t{outline:2px solid #fff}.seg i.r{background:var(--cell2)}
.steps{display:flex;gap:10px;align-items:center;margin:8px 0}.steps b{background:var(--ac);color:var(--on);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}
.mt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:22px;padding:16px;font-size:1.05rem;margin:0 0 10px}.mt svg{color:var(--ac);flex:none}
.brand{background:var(--deep);border:1px solid var(--ln);border-radius:999px;padding:6px 16px 6px 8px;width:fit-content}
.hero,.brand img{mix-blend-mode:lighten}.road{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px}.rk{flex:1 0 58px;text-align:center;opacity:.4;padding:6px 2px;border-radius:14px}.rk.on{opacity:1}.rk.cur{outline:2px solid var(--ac)}.rk small{display:block;font-size:.65rem;margin-top:2px}@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}.popin{animation:pop .5s ease both}.hero{border-radius:28px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
button{position:relative;overflow:hidden;transition:transform .12s ease}button:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}@keyframes rip{to{transform:scale(2.2);opacity:0}}
.mw{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mas{display:block;height:92px;width:auto;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.mas.sm{height:56px}.mas.md{height:104px}.mas.xl{height:170px}
.bob{animation:bob 3s ease-in-out infinite}.float{animation:flt 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}@keyframes flt{50%{transform:translateY(-9px)}}
.mw.jump .mas{animation:jump .6s ease}@keyframes jump{30%{transform:translateY(-26px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.par{display:inline-block;transform:translateY(calc(var(--sy,0)*-.12px))}
.say{position:absolute;bottom:100%;right:0;background:#fff;color:#0b1020;font:700 .8rem Barlow,sans-serif;padding:8px 12px;border-radius:14px;white-space:nowrap;opacity:0;transform:translateY(6px) scale(.9);pointer-events:none;transition:opacity .25s,transform .25s;z-index:3}.say.show{opacity:1;transform:none}
.mw.xl .say{left:50%;right:auto;margin-left:-70px;width:140px;white-space:normal;text-align:center}
.cele{position:fixed;inset:0;z-index:50;background:rgba(7,10,22,.9);backdrop-filter:blur(6px);display:grid;place-items:center;overflow:hidden;animation:fadein .25s}.cbox{text-align:center}.cbox h2{margin-top:12px}
.cele i{position:absolute;top:-16px;width:9px;height:16px;border-radius:2px;animation:fall 1.9s linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}@keyframes fadein{from{opacity:0}}
.msg{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.av{width:36px;height:36px;border-radius:50%;flex:none}.msg span{background:var(--c1);border:1px solid var(--ln);padding:8px 12px;border-radius:16px 16px 16px 4px}
.you{display:inline-block;background:var(--ac);color:var(--on);padding:8px 14px;border-radius:16px 16px 4px 16px;text-align:left}
.bar i,.pr i{animation:grow .9s ease both}@keyframes grow{from{width:0}}.hm i{animation:pop .5s ease both}
@keyframes swing{0%{transform:rotate(14deg)}30%{transform:rotate(-9deg)}55%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:none}}.grid svg{transform-origin:50% 0;animation:swing 1.3s ease both}
nav button.on svg{animation:pop .4s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
nav:empty{display:none}.wel{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:space-between;text-align:center}.welmid{margin:auto 0;padding:10px 0}.tag{font:700 1.15rem Barlow,sans-serif;color:var(--mu);margin:8px 0 0}.welbtn{display:grid;gap:12px;padding-bottom:10px}
.b3{display:block;width:100%;background:var(--ac);color:var(--on);border:0;border-radius:16px;padding:16px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:1rem;box-shadow:0 4px 0 #b8500a;margin:0;transition:transform .08s,box-shadow .08s;text-align:center;cursor:pointer}.b3:active{transform:translateY(4px);box-shadow:0 0 0 #b8500a}.b3.o{background:transparent;color:var(--ac);border:2px solid var(--ln);box-shadow:0 4px 0 var(--ln)}.b3:disabled{background:var(--cell);color:var(--mu);box-shadow:0 4px 0 var(--ln);cursor:not-allowed}
.ob{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}.obtop{display:flex;gap:12px;align-items:center;margin-bottom:18px}.back{background:none;color:var(--mu);padding:6px 10px;font-size:1.5rem;min-height:0;margin:0;border-radius:12px}.obbar{flex:1;height:14px;background:var(--cell);border-radius:8px;overflow:hidden}.obbar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .4s}
.ask{display:flex;align-items:center;gap:10px;margin-bottom:20px;animation:slidein .35s ease both}.bubble{position:relative;flex:1;background:var(--c1);border:2px solid var(--ln);border-radius:18px;padding:14px 16px;font:700 1.1rem/1.3 Barlow,sans-serif}.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ln);border-left:0}
.opts{display:grid;gap:10px;animation:slidein .35s .05s ease both}.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--c2);color:var(--tx);border:2px solid var(--ln);border-bottom-width:4px;border-radius:16px;padding:14px;text-align:left;font:700 1rem Barlow,sans-serif;font-style:normal;margin:0;min-height:56px;transition:transform .08s}.opt:active{transform:translateY(2px)}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--c2));color:var(--ac)}
.dayrow{display:flex;gap:8px;justify-content:space-between;animation:slidein .35s .05s ease both}.dchip{flex:1;aspect-ratio:1;min-width:0;padding:0;border-radius:50%;background:var(--c2);color:var(--tx);border:2px solid var(--ln);border-bottom-width:4px;font:800 1rem Barlow,sans-serif;font-style:normal;margin:0;min-height:0}.dchip.sel{border-color:var(--ac);background:var(--ac);color:var(--on)}.dchip:disabled{opacity:.3}
.big-in{width:100%;font-size:1.4rem;padding:16px;border-radius:16px;border:2px solid var(--ln);border-bottom-width:4px;background:var(--c2);color:var(--tx);animation:slidein .35s .05s ease both}.big-in:focus{border-color:var(--ac);outline:0}
.obfoot{margin-top:auto;padding-top:24px;display:grid;gap:10px}.err{color:var(--bad);font-weight:700;margin:10px 0 0;animation:shake .35s}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

 h+=newMedalCard()+pauseCard()+streakCard()+rankCard();h+=`<div class="card"><div class="mu">YOUR 90-DAY JOURNEY</div><div class="num">${Math.min(Math.max(n,0),90)}<small> / 90</small></div><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,Math.max(0,n)/.9)}%"></i></div><p class="mu">${n<1?"Starts tomorrow":n>90?"Block complete":ph}</p><div class="hm">${S.plan.map(x=>{const d=add(S.p.start,x.d),l=S.logs[d];return`<i class="${done(l)?"d":l&&l.st=="miss"?"m":x.type=="rest"?"r":""} ${d==t?"t":""}"></i>`}).join("")}</div><p class="mu">Green = done · Orange = missed · Outline = today</p></div>`;
 h+=`<div class="card"><h3>This week</h3><div class="seg">${wk.map(x=>{const d=add(S.p.start,x.d),l=S.logs[d];return`<i class="${done(l)?"d":l&&l.st=="miss"?"m":x.type=="rest"?"r":""} ${d==t?"t":""}">${DN[pd(d).getDay()][0]}</i>`}).join("")}</div><p class="mu">${wdn} of ${wpl} workouts done this week</p></div>`;
 h+=`<div class="grid" style="margin-bottom:12px"><div class="tile t1"><small>THIS WEEK</small><div class="num">${U(wp.a)}</div></div><div class="tile t2"><small>WORKOUTS DONE</small><div class="num">${nd}</div></div><div class="tile t3"><small>LONGEST RUN</small><div class="num">${U(lg)}</div></div></div>`;
 h+=`<div class="card"><h3>How you’re doing</h3>`+pb("Workouts this week",pc(wdn,wpl))+pb("Distance this week",pc(wp.a,wp.b))+pb("Staying consistent",c===null?0:c)+`</div>`;
 if(pr.why.length)h+=`<div class="card warn"><b>Plan check</b><br>${pr.why.join("<br>")}<br><br><button onclick="prevAdapt()">Preview changes</button></div>`;
 return h+`<div class="card"><h3>Weekly distance</h3><p class="mu">Grey = planned · Green = done · White = your best week</p>${bars(ws)}</div>`+report(cw)+`<div class="card"><p class="mu">${QUOTES[n%4]}</p></div>`},
plan(){const sel=S.sel==null?Math.max(0,dayN()-1):S.sel,t=today();let h=`<h1>Your 90-day plan</h1><p class="mu">Tap any day to see exactly what to do. Green outline = a harder day.</p>${(S.p.rate||0)>.09?`<div class="card warn">Your goal is ambitious for your current PB, so this plan builds distance faster than usual (about ${Math.round(S.p.rate*100)}% more each week). That raises injury risk and success isn’t guaranteed. Keep easy runs easy, tell your coach, and stop and see a healthcare professional if pain appears.</div>`:""}`;
 for(let w=0;w<13;w++){const ws=S.plan.filter(x=>x.w==w);h+=`<div class="mu">Week ${w+1} · ${ws.reduce((a,x)=>a+x.km,0).toFixed(0)} km planned${(w+1)%4==0?" · recovery week":""}</div><div class="wk">${ws.map(x=>{const d=add(S.p.start,x.d),ty=S.mod[x.d]||x.type,ql=["threshold","intervals","racepace","hills","fartlek","timetrial","race","team"].includes(ty);return`<div class="${ql?"q":""} ${d==t?"t":""} ${x.d==sel?"s":""} ${done(S.logs[d])?"d":""}" onclick="S.sel=${x.d};render()">${DN[pd(d).getDay()]}<br>${NAMES[ty].split(" ")[0]}${x.km?"<br>"+x.km:""}</div>`}).join("")}</div>`}
 const it=S.plan.find(x=>x.d==sel);return h+(it?dtl(it,1):"")},
log(){const d=S.sel!=null?add(S.p.start,S.sel):today(),it=S.plan.find(x=>add(S.p.start,x.d)==d),l=S.logs[d]||{};
 return`<h1>How did it go?</h1><p class="mu">Fill in what you did. It takes one minute.</p><label>Date<input type="date" id="ld" value="${d}" onchange="S.sel=diff(S.p.start,this.value);render()"></label><p class="mu">Planned: ${it?NAMES[S.mod[it.d]||it.type]+" · "+U(it.km):"Outside the plan"}</p><div class="card"><label>Status<select id="st">${[["done","Completed as planned"],["mod","Completed with modifications"],["part","Partially completed"],["miss","Missed"],["other","Replaced with another activity"]].map(x=>`<option value="${x[0]}" ${l.st==x[0]?"selected":""}>${x[1]}</option>`)}</select></label><div class="row"><label>Distance (km)<input id="lk" type="number" step=".1" value="${l.km||""}"></label><label>How long? (minutes)<input id="lm" type="number" value="${l.min||""}"></label><label>Heart rate (optional)<input id="lh" type="number" value="${l.hr||""}"></label></div><div class="row"><label>How hard did it feel? (1 easy, 10 hardest)<input id="le" type="number" min="1" max="10" value="${l.eff||""}"></label><label>How tired are you? (1 fresh, 10 wiped out)<input id="lf" type="number" min="1" max="10" value="${l.fat||""}"></label><label>How did you sleep? (1 badly, 5 great)<input id="ls" type="number" min="1" max="5" value="${l.sl||""}"></label></div><label>Mood and motivation<input id="lo" value="${esc(l.mood)}"></label><label><input type="checkbox" id="lp" ${l.pain?"checked":""} style="width:auto"> Pain or unusual discomfort</label><label>Notes<textarea id="ln">${esc(l.note)}</textarea></label><button onclick="saveLog('${d}')">Save log</button>${l.km&&l.min?`<span class="mu">Pace: ${PU(l.min*60/l.km)}</span>`:""}</div><p class="mu">Missed a session? No penalty and no doubling up.</p>`},
perf(){const ws=wkStats(),ls=Object.keys(S.logs).sort().map(k=>S.logs[k]).filter(l=>done(l)&&l.km&&l.min);return`<h1>Progress</h1>${predCard()}${snapCard()}${loadCard()}<div class="card"><h3>Weekly distance</h3>${bars(ws)}</div><div class="card"><h3>Effort and fatigue</h3>${lines()}</div><div class="card"><h3>Pace per logged run</h3>${ls.length?`<table>${ls.slice(-10).map(l=>`<tr><td>${U(l.km)}</td><td>${PU(l.min*60/l.km)}</td><td>effort ${l.eff||"–"}</td></tr>`).join("")}</table>`:`<p class="mu">Log runs with distance and time to see pace.</p>`}<p class="mu">All figures are recorded by you. Nothing here is an estimate of fitness.</p></div>`+report(Math.min(12,Math.max(0,Math.floor((dayN()-1)/7))))},
coach(){return`<div style="display:flex;align-items:center;gap:12px">${dashImg("think","sm")}<h1 style="margin:0">AI Coach</h1></div><p class="mu">Powered by Claude using your plan, logs and races. If the AI is unavailable, a built-in coach answers instead. No nutrition or hydration advice.</p><div class="card" id="cl" style="white-space:pre-wrap">${chatHtml()}</div><label>Ask your coach<input id="q" onkeydown="if(event.key=='Enter')ask()"></label><button onclick="ask()">Ask</button>`},
races(){const best={};S.races.forEach(r=>{const s=secs(r.t);if(s&&(!best[r.ev]||s<secs(best[r.ev].t)))best[r.ev]=r});return`<h1>Race results</h1><div class="card"><div class="row"><label>Date<input id="rd" type="date" value="${today()}"></label><label>Event<select id="re">${evo(S.p.ev)}</select></label><label>Finish time<input id="rt" placeholder="mm:ss"></label></div><div class="row"><label>Start pace<select id="rp"><option>Too fast</option><option selected>About right</option><option>Too slow</option></select></label><label>Notes (course, weather)<input id="rn"></label></div><button onclick="addRace()">Add result</button></div>${Object.values(best).length?`<h3>Personal bests</h3><div class="card"><table>${Object.values(best).map(r=>`<tr><td>${evn[r.ev]}</td><td><b>${r.t}</b></td><td>${PU(secs(r.t)/(r.ev/1000))}</td></tr>`).join("")}</table></div>`:""}<h3>History</h3>${S.races.length?S.races.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(r=>`<div class="card"><b>${r.d} · ${evn[r.ev]} · ${r.t}</b> <span class="mu">${PU(secs(r.t)/(r.ev/1000))}</span><p class="mu">${r.rp=="Too fast"?"You started too fast. Next time hold back in the first third.":r.rp=="Too slow"?"You started cautiously. Practise race-pace work to find a bolder, still even, opening.":"Pacing felt right. Keep repeating that rhythm."} ${esc(r.n)}</p><button class="g" onclick="aiRace(${S.races.indexOf(r)})">AI race review</button><div id="rv${S.races.indexOf(r)}" style="white-space:pre-wrap"></div></div>`).join(""):`<div style="text-align:center">${dashImg("cool","md")}</div><p class="mu">No results yet. Add your first race or time trial.</p>`}`},
learn(){return`<h1>Learn</h1><div class="card">${LEARN.map(a=>`<details><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join("")}</div>`},
prof(){const p=S.p;return`<h1>Profile</h1><div class="card"><b>Account</b><p class="mu" id="who">${who||"Not signed in"}</p><p class="mu" id="sync">${sync}</p></div><div class="card"><p><b>${esc(p.name)}</b>, ${p.age} · ${esc(p.city)} · ${p.level}</p><p class="mu">Event: ${evn[p.ev]}${(p.sec||[]).length?" (also "+p.sec.map(e=>evn[e]).join(", ")+")":""} · PB: ${p.pb||"–"} · Target: ${p.goal||"–"} · Days: ${p.days.map(d=>DN[d]).join(", ")}${p.raceDate?" · Race: "+p.raceDate:""}</p><label>Units<select onchange="S.p.unit=this.value;save();render()"><option value="km" ${p.unit=="km"?"selected":""}>Kilometres</option><option value="mi" ${p.unit=="mi"?"selected":""}>Miles</option></select></label><button onclick="regen()">Regenerate plan from today</button><button class="g" onclick="exp()">Export my data</button><button class="g" onclick="signOut()">Sign out of this device</button><button class="g" onclick="wipe()">Delete my data</button></div>${planCard()}${teamCard()}${secCard()}<p class="mu">On this version your data is stored only in this browser. Clearing browser data deletes it, so export a backup from time to time. STRIDR gives no medical or nutrition advice; your plan is guidance, not a guarantee.</p>`}};
function report(w){const ws=wkStats()[w],c=consistency(),ls=Object.keys(S.logs).filter(k=>diff(k,today())<7&&diff(k,today())>=0).map(k=>S.logs[k]),mi=ls.filter(l=>l.st=="miss").length,f=ls.length?(ls.reduce((a,l)=>a+(+l.fat||0),0)/ls.length).toFixed(1):null;
 return`<div class="card"><h3>Weekly coaching report</h3><p><b>Went well:</b> ${ls.filter(done).length?ls.filter(done).length+" sessions logged in the last 7 days. "+(c!==null?"Overall consistency "+c+"%.":""):"Nothing logged yet. Your first log starts the picture."}</p><p><b>Needs attention:</b> ${mi?mi+" missed session(s), so we’ll review the week without doubling up. ":""}${f&&f>=7?"Fatigue is high; consider easier training. ":""}${!mi&&!(f&&f>=7)?"No concerns flagged.":""}</p><p><b>Data suggests:</b> ${U(ws.a)} recorded of ${U(ws.b)} planned this week.</p><p><b>Next focus:</b> keep easy runs easy and protect your key session. Tip: sleep and routine are training too.</p><button class="g" onclick="aiNote()">Write my AI coaching note</button><div id="ainote" style="white-space:pre-wrap"></div></div>`}
function saveLog(d){const v=i=>$("#"+i).value;S.logs[d]={st:v("st"),km:v("lk"),min:v("lm"),hr:v("lh"),eff:v("le"),fat:v("lf"),sl:v("ls"),mood:v("lo"),pain:$("#lp").checked,note:v("ln")};save();const pn=$("#lp").checked;if(pn)alert("Saved. You reported pain: please rest from hard sessions and see a qualified healthcare professional.");celebrate(pn?"calm":"cheer",pn?"Saved. Take care of yourself.":"Nice work! Logged.")}
function addRace(){const t=$("#rt").value;if(!secs(t)){alert("Enter a time as mm:ss or h:mm:ss.");return}S.races.push({d:$("#rd").value,ev:$("#re").value,t,rp:$("#rp").value,n:$("#rn").value});save();render()}

function prevAdapt(){const pr=proposals();prev=pr;const el=document.createElement("div");el.className="card";el.innerHTML=`<h3>Proposed changes</h3>${pr.ch.length?pr.ch.map(c=>`<p>${add(S.p.start,c.d)}: ${NAMES[S.plan[c.d].type]} → Easy run</p>`).join(""):"<p>No demanding sessions in the next 7 days. Consider a rest day.</p>"}<button onclick="applyAdapt()">Apply changes</button><button class="g" onclick="render()">Cancel</button>`;$("#app").prepend(el);window.scrollTo(0,0)}
function applyAdapt(){prev.ch.forEach(c=>S.mod[c.d]=c.to);save();render()}
function regen(){const keep=S.logs;S.p.start=today();S.plan=gen(S.p);S.mod={};S.logs={};save();alert("New plan from today. Previous logs were cleared; export first next time if you want a copy.");render()}
function exp(){const a=document.createElement("a");a.href="data:application/json,"+encodeURIComponent(JSON.stringify(S));a.download="stridr-data.json";a.click()}
render();boot();initFx();
</script></body></html>
